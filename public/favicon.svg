<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E4E"/>
      <stop offset="100%" stop-color="#240328"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B48618"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="94" height="94" rx="23" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
  
  <!-- Medical Cross & Book -->
  <g filter="url(#glow)">
    <!-- Medical Cross -->
    <rect x="42" y="18" width="16" height="42" rx="4" fill="url(#goldGrad)"/>
    <rect x="29" y="31" width="42" height="16" rx="4" fill="url(#goldGrad)"/>
    
    <!-- Open Book at Base -->
    <path d="M22 71 Q36 64 50 69 Q64 64 78 71 L78 76 Q64 69 50 74 Q36 69 22 76 Z" fill="#FFFFFF"/>
    <path d="M50 69 L50 76" stroke="#4A0E4E" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
